<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pace-Rechner · Training</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:auto;padding:20px;background:#f5f6f8;color:#172033}.back{color:inherit;text-decoration:none}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:16px}label{display:block;margin:12px 0 5px;font-weight:650}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{margin-top:16px;padding:11px 15px;border:0;border-radius:10px;background:#172033;color:#fff;font-weight:700}.result{font-size:28px;font-weight:850;margin-top:15px}.muted{color:#64748b}</style></head><body><a class="back" href="index.html">← Training</a><h1>⏱️ Pace-Rechner</h1><div class="muted">Zielzeit und Distanz → benötigte Durchschnittspace</div><div class="card"><label for="distance">Distanz (km)</label><input id="distance" type="number" step="0.01" value="21.1"><label for="hours">Stunden</label><input id="hours" type="number" min="0" value="1"><label for="minutes">Minuten</label><input id="minutes" type="number" min="0" value="40"><label for="seconds">Sekunden</label><input id="seconds" type="number" min="0" max="59" value="0"><button onclick="calc()">Berechnen</button><div id="result" class="result">4:44 min/km</div></div><script>function calc(){const d=Number(distance.value),s=Number(hours.value)*3600+Number(minutes.value)*60+Number(seconds.value);if(!d||!s)return;const p=s/d,m=Math.floor(p/60),sec=Math.round(p%60);document.getElementById('result').textContent=m+':'+String(sec).padStart(2,'0')+' min/km'}calc()</script></body></html>
