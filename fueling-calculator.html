<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fueling-Rechner · Training</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:auto;padding:20px;background:#f5f6f8;color:#172033}.back{color:inherit;text-decoration:none}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:16px}label{display:block;margin:12px 0 5px;font-weight:650}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{margin-top:16px;padding:11px 15px;border:0;border-radius:10px;background:#172033;color:#fff;font-weight:700}.result{font-size:22px;font-weight:800;margin-top:15px}.muted{color:#64748b}</style></head><body><a class="back" href="index.html">← Training</a><h1>🥤 Fueling-Rechner</h1><div class="muted">Kohlenhydratbedarf für Laufdauer und gewünschte Aufnahme</div><div class="card"><label for="duration">Laufdauer (Minuten)</label><input id="duration" type="number" value="120"><label for="carbs">Ziel (g Kohlenhydrate/Stunde)</label><input id="carbs" type="number" value="75"><label for="gel">Kohlenhydrate pro Gel (g)</label><input id="gel" type="number" value="30"><button onclick="calc()">Berechnen</button><div id="result" class="result"></div></div><script>function calc(){const h=Number(duration.value)/60,c=Number(carbs.value),g=Number(gel.value);const total=h*c,n=Math.ceil(total/g);document.getElementById('result').innerHTML=total.toFixed(0)+' g Kohlenhydrate insgesamt<br>'+n+' Gels à '+g+' g als Näherung'}calc()</script></body></html>
