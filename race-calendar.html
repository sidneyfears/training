<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Kalender · Training</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:1000px;margin:auto;padding:28px;background:#f5f6f8;color:#172033}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:14px}.race{display:grid;grid-template-columns:130px 1fr 130px 120px;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f3}.race:last-child{border:0}.date{font-weight:800}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.main{font-size:19px;font-weight:800}.muted{color:#64748b}@media(max-width:650px){.race{grid-template-columns:1fr 1fr}.race .main{grid-column:1/-1}}</style></head><body><div class="top"><div><div class="muted">Training & Fueling</div><h1>🏁 Race Kalender</h1></div><a href="index.html">← Training</a></div><div class="card" id="calendar"></div><script src="data/races.js"></script><script>const el=document.getElementById('calendar');const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});el.innerHTML=races.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<div class="race"><div class="date">${fmt(r.date)}</div><div><div class="main">${r.name}</div><div class="muted">${r.distance}</div></div><div class="muted">${r.date<new Date().toISOString().slice(0,10)?'Vergangen':'Anstehend'}</div><div><span class="badge">${r.status}</span></div></div>`).join('');</script></body></html>
