<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Training · Workouts</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#172033}main{max-width:1100px;margin:auto;padding:20px}.back{display:inline-block;margin-bottom:12px;text-decoration:none;color:#475569}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:14px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f3}th{font-size:11px;color:#64748b;text-transform:uppercase}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fafc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.arrow{color:#64748b;font-size:18px}@media(max-width:650px){main{padding:14px}.desktop{display:none}table,tbody,tr,td{display:block}thead{display:none}tr{padding:10px 0;border-bottom:1px solid #edf0f3}td{border:0;padding:3px 0}td:first-child{font-weight:800}td:last-child{float:right;margin-top:-24px}.card{padding:14px}}</style></head><body><main><a class="back" href="index.html">← Training</a><h1>🏃 Workouts</h1><p style="color:#64748b">Geplante und absolvierte Einheiten</p><div class="card"><h2>Alle Workouts</h2><table><thead><tr><th>Datum</th><th>Einheit</th><th>Distanz</th><th>Pace</th><th>HF</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="data/workouts.js"></script><script>const rows=document.getElementById('rows');const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE');rows.innerHTML=[...workouts].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<tr onclick="location.href='workout.html?id=${w.id}'"><td>${fmt(w.date)}</td><td><b>${w.name}</b><br><small>${w.type}</small></td><td>${w.distance??'—'}${w.distance?' km':''}</td><td>${w.pace}</td><td>${w.hr}</td><td><span class="badge">${w.status}</span> <span class="arrow">›</span></td></tr>`).join('');</script></body></html>
