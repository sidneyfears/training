<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainingstagebuch</title><style>body{font-family:system-ui;max-width:1100px;margin:auto;padding:28px;background:#f5f6f8;color:#172033}.back{color:inherit;text-decoration:none}h1{margin-bottom:4px}.muted{color:#64748b}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:700;font-size:13px;display:block;margin-bottom:10px}input,textarea,select{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #d1d5db;border-radius:9px}textarea{min-height:80px}button{padding:10px 14px;border:0;border-radius:9px;background:#111827;color:#fff;cursor:pointer}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><a class="back" href="index.html">← Training</a><h1>📓 Trainingstagebuch</h1><div class="muted">Vorbereitung → Workout → Nachbesprechung</div><div class="grid"><div class="card"><h2>Vorbereitung</h2><label>Datum<input id="date" type="date" value="2026-08-30"></label><label>Workout<select id="type"><option>Longrun</option><option>Easy</option><option>Tempo</option><option>Intervalle</option><option>Race</option><option>Rad</option></select></label><label>Schlaf / Erholung<input id="recovery"></label><label>Energie 1–10<input id="energy" type="number" min="1" max="10"></label><label>Beine / Körpergefühl<textarea id="body"></textarea></label><label>Zielpace / Power<input id="target"></label><label>Geplantes Fueling<textarea id="fuelPlan">75 g Van Rysel 1:0,8 + 500 ml Wasser; zusätzlich 300–500 ml Wasser nach Durst; kein Gel.</textarea></label></div><div class="card"><h2>Workout</h2><label>Distanz km<input id="distance" type="number" step="0.01"></label><label>Dauer<input id="duration"></label><label>Ø Pace<input id="pace"></label><label>Ø HF<input id="hr" type="number"></label><label>RPE 1–10<input id="rpe" type="number" min="1" max="10"></label><label>Splits / Intervalle<textarea id="splits"></textarea></label><label>Tatsächliches Fueling & Flüssigkeit<textarea id="fuel"></textarea></label></div></div><div class="card"><h2>Nachbesprechung</h2><div class="grid"><label>Gefühl<textarea id="feel"></textarea></label><label>Energieversorgung<textarea id="postEnergy"></textarea></label><label>Magen-Darm 1–10<input id="gut" type="number" min="1" max="10"></label><label>Drink/Gel-Verträglichkeit<textarea id="fuelFeel"></textarea></label><label>Pacing / Soll-Ist<textarea id="pacing"></textarea></label><label>Learnings<textarea id="learn"></textarea></label></div><button onclick="save()">Eintrag speichern</button><p id="msg" class="muted"></p></div><script>const ids=['date','type','recovery','energy','body','target','fuelPlan','distance','duration','pace','hr','rpe','splits','fuel','feel','postEnergy','gut','fuelFeel','pacing','learn'];function save(){const o={};ids.forEach(id=>o[id]=document.getElementById(id).value);o.savedAt=new Date().toISOString();const a=JSON.parse(localStorage.getItem('trainingJournal')||'[]');a.push(o);localStorage.setItem('trainingJournal',JSON.stringify(a));document.getElementById('msg').textContent='Eintrag gespeichert.'}</script></body></html>
