<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Workout · Training</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#172033}main{max-width:900px;margin:auto;padding:20px}.back{display:inline-block;margin-bottom:12px;text-decoration:none;color:#475569}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{font-size:24px;font-weight:850}.muted{color:#64748b}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:750}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><a class="back" href="workouts.html">← Workouts</a><div id="app"></div></main><script src="data/workouts.js"></script><script>const id=new URLSearchParams(location.search).get('id');const w=workouts.find(x=>x.id===id)||workouts[0];document.title=w.name+' · Training';const date=new Date(w.date+'T12:00:00').toLocaleDateString('de-DE');document.getElementById('app').innerHTML=`<div><span class="badge">${w.status}</span><h1>${w.name}</h1><p class="muted">${date} · ${w.type}</p></div><div class="grid"><div class="card"><div class="muted">Distanz</div><div class="metric">${w.distance??'—'}${w.distance?' km':''}</div></div><div class="card"><div class="muted">Dauer</div><div class="metric">${w.duration}</div></div><div class="card"><div class="muted">Pace</div><div class="metric">${w.pace}</div></div><div class="card"><div class="muted">Ø HF</div><div class="metric">${w.hr}${w.hr&&w.hr!=='—'?' bpm':''}</div></div></div><div class="card"><h2>Workout-Notizen</h2><p>${w.notes||'Noch keine zusätzlichen Notizen hinterlegt.'}</p></div>`;</script></body></html>
