<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Workout · Training</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#172033}main{max-width:1000px;margin:auto;padding:20px}.back{display:inline-block;margin-bottom:12px;text-decoration:none;color:#475569}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{font-size:24px;font-weight:850}.muted{color:#64748b}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:750}.status{font-size:14px;margin-top:8px}.table-wrap{overflow-x:auto}.splits{width:100%;border-collapse:collapse;font-size:14px}.splits th,.splits td{padding:9px 7px;border-bottom:1px solid #e5e7eb;text-align:right;white-space:nowrap}.splits th:first-child,.splits td:first-child{text-align:left}.strava{border-left:4px solid #fc4c02}.empty{color:#64748b}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.metric{font-size:20px}.card{padding:14px}} </style></head><body><main><a class="back" href="workouts.html">← Workouts</a><div id="app"></div></main><script src="data/workouts.js"></script><script>
const id=new URLSearchParams(location.search).get('id');
const w=workouts.find(x=>x.id===id)||workouts[0];
document.title=w.name+' · Training';
const date=new Date(w.date+'T12:00:00').toLocaleDateString('de-DE');
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const pace=s=>{if(s==null)return '—';const sec=Number(s);if(!isFinite(sec))return '—';return `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,'0')}/km`};
const hr=v=>v==null?'—':Math.round(v);
const km=v=>v==null?'—':(Number(v)/1000).toFixed(2);
const render=a=>{
 let html=`<div><span class="badge">${esc(w.status)}</span><h1>${esc(w.name)}</h1><p class="muted">${date} · ${esc(w.type)}</p></div><div class="grid"><div class="card"><div class="muted">Distanz</div><div class="metric">${a?km(a.distance_m):w.distance??'—'}${a?' km':w.distance?' km':''}</div></div><div class="card"><div class="muted">Dauer</div><div class="metric">${a&&a.moving_time_s!=null?new Date(a.moving_time_s*1000).toISOString().substr(11,8):esc(w.duration)}</div></div><div class="card"><div class="muted">Pace</div><div class="metric">${a&&a.average_speed_mps?pace(1000/a.average_speed_mps):esc(w.pace)}</div></div><div class="card"><div class="muted">Ø HF</div><div class="metric">${a?hr(a.average_heartrate):esc(w.hr)}${(a&&a.average_heartrate)||w.hr&&w.hr!=='—'?' bpm':''}</div></div></div>`;
 if(a){html+=`<div class="card strava"><h2>Strava Analyse</h2><div class="grid"><div><div class="muted">Max HF</div><div class="metric">${hr(a.max_heartrate)} bpm</div></div><div><div class="muted">Ø Leistung</div><div class="metric">${a.average_watts!=null?Math.round(a.average_watts)+' W':'—'}</div></div><div><div class="muted">Ø Kadenz</div><div class="metric">${a.average_cadence!=null?Math.round(a.average_cadence):'—'}${a.average_cadence!=null?' rpm':''}</div></div><div><div class="muted">Höhenmeter</div><div class="metric">${a.total_elevation_gain_m!=null?Math.round(a.total_elevation_gain_m):'—'}${a.total_elevation_gain_m!=null?' m':''}</div></div></div>`;
 const splits=Array.isArray(a.splits_metric)?a.splits_metric:[];
 if(splits.length){html+=`<h3>Km-Splits</h3><div class="table-wrap"><table class="splits"><thead><tr><th>km</th><th>Pace</th><th>HF</th><th>Leistung</th><th>Höhe</th><th>Steigung</th></tr></thead><tbody>${splits.map((s,i)=>`<tr><td>${i+1}</td><td>${pace(s.moving_time/(s.distance||1)*1000)}</td><td>${hr(s.average_heartrate)} bpm</td><td>${s.average_watts!=null?Math.round(s.average_watts)+' W':'—'}</td><td>${s.elevation_difference!=null?Math.round(s.elevation_difference)+' m':'—'}</td><td>${s.average_grade!=null?Number(s.average_grade).toFixed(1)+' %':'—'}</td></tr>`).join('')}</tbody></table></div>`}
 const laps=Array.isArray(a.laps)?a.laps:[];
 if(laps.length){html+=`<h3>Laps / Intervalle</h3><div class="table-wrap"><table class="splits"><thead><tr><th>Lap</th><th>Distanz</th><th>Zeit</th><th>Pace</th><th>HF</th><th>Leistung</th></tr></thead><tbody>${laps.map((l,i)=>`<tr><td>${i+1}</td><td>${km(l.distance)} km</td><td>${l.elapsed_time?new Date(l.elapsed_time*1000).toISOString().substr(11,8):'—'}</td><td>${l.average_speed?pace(1000/l.average_speed):'—'}</td><td>${hr(l.average_heartrate)} bpm</td><td>${l.average_watts!=null?Math.round(l.average_watts)+' W':'—'}</td></tr>`).join('')}</tbody></table></div>`}
 html+='</div>';
 }
 html+=`<div class="card"><h2>Workout-Notizen</h2><p>${esc(w.notes||'Noch keine zusätzlichen Notizen hinterlegt.')}</p></div>`;
 document.getElementById('app').innerHTML=html;
};
render(null);
fetch(`/api/strava/activity?date=${encodeURIComponent(w.date)}`).then(r=>r.ok?r.json():Promise.reject(new Error('Strava API'))).then(({activity})=>{if(activity)render(activity);}).catch(()=>{});
</script></body></html>
